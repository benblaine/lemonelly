name: verify

# Enforces the draft-system invariants (see scripts/verify.sh and CLAUDE.md):
# generated pages in sync, every draft noindex, zero external requests, no draft
# in the sitemap, robots.txt keeps Disallow: /draft/. Pure stdlib — no deps.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # verify.sh check 1 diffs generated files against the tree
      - name: Run invariant checks
        run: bash scripts/verify.sh
